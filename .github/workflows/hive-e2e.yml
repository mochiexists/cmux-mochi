name: Mac to Mac Hive E2E
run-name: Hive E2E on ${{ (!inputs.runner || inputs.runner == 'auto') && (vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') || inputs.runner }} @ ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to test
        required: false
        default: ""
      runner:
        description: macOS 26 runner label (auto follows MACOS_RUNNER_26)
        required: false
        default: auto
        type: string

permissions:
  contents: read

concurrency:
  group: hive-e2e-${{ (!inputs.runner || inputs.runner == 'auto') && (vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') || inputs.runner }}-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  hive-e2e:
    runs-on: ${{ (!inputs.runner || inputs.runner == 'auto') && (vars.MACOS_RUNNER_26 || 'blacksmith-6vcpu-macos-26') || inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Verify pinned Xcode
        run: |
          set -euo pipefail
          test -d /Applications/Xcode-26.6.app/Contents/Developer
          export DEVELOPER_DIR=/Applications/Xcode-26.6.app/Contents/Developer
          xcodebuild -version

      - name: Provision build dependencies
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode-26.6.app/Contents/Developer
          ./scripts/install-zig-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh || ./scripts/ensure-ghosttykit.sh
          if [ -f scripts/ensure-cmux-iroh.sh ]; then
            ./scripts/install-rust-ci.sh
            export PATH="$HOME/.cargo/bin:$PATH"
            ./scripts/ensure-cmux-iroh.sh
          fi

      - name: Run Mac to Mac Hive E2E
        run: |
          set -euo pipefail
          ./scripts/e2e/hive-e2e.sh \
            --tag "hive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --derived-data "$RUNNER_TEMP/hive-e2e-dd" \
            --artifact-dir "$RUNNER_TEMP/hive-e2e-artifacts"

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hive-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hive-e2e-artifacts/**
            !${{ runner.temp }}/hive-e2e-artifacts/host-devicelink-state/**
            !${{ runner.temp }}/hive-e2e-artifacts/host-hive-state/**
            !${{ runner.temp }}/hive-e2e-artifacts/client-devicelink-state/**
            !${{ runner.temp }}/hive-e2e-artifacts/client-hive-state/**
          if-no-files-found: warn
