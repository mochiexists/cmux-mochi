name: Deploy docs channels

on:
  # Fork (cmux Mochi): docs deploys are disabled. Both jobs push upstream's
  # `web/` docs site to Vercel using VERCEL_ORG_ID / VERCEL_*_DOCS_PROJECT_ID /
  # VERCEL_TOKEN. This fork has none of those secrets and no Vercel project to
  # deploy into, so every trigger failed at `vercel: No existing credentials`
  # (2026-08-09: the first push to the rebased main). Left dispatch-only rather
  # than deleted so the file stays rebase-clean against upstream.
  # push:
  #   branches: [main]
  #   paths: ["web/**", "CHANGELOG.md"]
  #   tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docs-deploy-reusable.yml
    with:
      channel: nightly
    secrets:
      vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
      vercel_project_id: ${{ secrets.VERCEL_NIGHTLY_DOCS_PROJECT_ID }}
      vercel_token: ${{ secrets.VERCEL_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docs-deploy-reusable.yml
    with:
      channel: release
    secrets:
      vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
      vercel_project_id: ${{ secrets.VERCEL_RELEASE_DOCS_PROJECT_ID }}
      vercel_token: ${{ secrets.VERCEL_TOKEN }}
