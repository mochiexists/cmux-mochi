name: Vercel auth health

on:
  # Fork (cmux Mochi): the daily canary is disabled. It checks upstream's
  # VERCEL_TOKEN, which this fork does not have and will never have — we ship
  # the macOS app, not the docs site — so the cron only produced a guaranteed
  # daily red run. Kept dispatch-only so the file stays rebase-clean against
  # upstream and can be run by hand if the fork ever gets a Vercel project.
  # schedule:
  #   - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Verify Vercel token
        run: bunx vercel@56.3.1 whoami
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
