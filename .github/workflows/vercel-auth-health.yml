name: Vercel auth health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # This is a health check for a configured token, not a check that
          # the token is configured. With no VERCEL_TOKEN secret on this fork
          # it failed every morning and mailed the owner. Skip until one exists.
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::notice::VERCEL_TOKEN is not configured on this repository; skipping the auth health check."
            exit 0
          fi
          bunx vercel@56.3.1 whoami
